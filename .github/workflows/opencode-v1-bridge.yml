name: OpenCode v1 bridge

on:
  pull_request:
    paths:
      - src/opencode/v1-cli-bridge/**
      - .github/workflows/opencode-v1-bridge.yml
  push:
    branches: [main]
    paths:
      - src/opencode/v1-cli-bridge/**
      - .github/workflows/opencode-v1-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-15
            python: '3.13'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run isolated safety tests
        run: python -m unittest discover -s src/opencode/v1-cli-bridge -p 'test_*.py' -v
      - name: Check command surface
        run: python src/opencode/v1-cli-bridge/opencode_v1_bridge.py --help
